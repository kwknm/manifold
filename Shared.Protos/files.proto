syntax = "proto3";

import "google/protobuf/empty.proto";

option csharp_namespace = "Shared.Protos";

service Files {
  rpc UploadBook (stream FileChunk) returns (UploadResponse);
  rpc UploadCover (stream FileChunk) returns (UploadResponse);
  rpc DownloadFile (DownloadRequest) returns (stream FileChunk);
  rpc DeleteFile (DeleteRequest) returns (google.protobuf.Empty);
  rpc GetPresignedUrl (PresignedUrlRequest) returns (PresignedUrlResponse);
}

message FileChunk {
  string file_name = 1;
  string content_type = 2;
  int64 total_size = 3;
  bytes data = 4;
}

message DownloadRequest {
  string file_id = 1;
}

message DeleteRequest {
  string file_id = 1;
}

message UploadResponse {
  string file_id = 1;
}

message PresignedUrlRequest {
  string file_id = 1;
}

message PresignedUrlResponse {
  string url = 1;
  string file_name = 2;
  string content_type = 3;
}