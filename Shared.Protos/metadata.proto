syntax = "proto3";

option csharp_namespace = "Shared.Protos";

service Metadata {
  rpc FetchBookMetadata (MetadataRequest) returns (MetadataResponse);
}

message MetadataRequest {
  string file_id = 1;
  string file_name = 2;
  string content_type = 3;
}

message MetadataResponse {
  optional string title = 1;
  repeated string authors = 2;
  optional string isbn = 3;
  optional int32 page_count = 4;
  optional string cover_file_id = 5;
}